version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vbq_api
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - REDIS_URL=redis://redis:6379/0
      - DB_URL=postgresql+asyncpg://postgres:postgres@db:5432/vbq
    depends_on:
      - redis
      - db
    volumes:
      - ../:/app
      
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vbq_worker
    command: python -m src.pipeline.pipeline_manager
    environment:
      - ENV=development
      - REDIS_URL=redis://redis:6379/0
      - DB_URL=postgresql+asyncpg://postgres:postgres@db:5432/vbq
    depends_on:
      - redis
      - db
      
  redis:
    image: redis:7-alpine
    container_name: vbq_redis
    ports:
      - "6379:6379"
      
  db:
    image: postgres:15-alpine
    container_name: vbq_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vbq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
volumes:
  postgres_data:
