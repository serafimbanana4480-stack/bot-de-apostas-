version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-valuebetting}
      POSTGRES_USER: ${POSTGRES_USER:-vb_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vb_admin} -d ${POSTGRES_DB:-valuebetting}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vb-network

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vb-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - vb-network

  # 3. FastAPI Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vb-api
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-valuebetting}
      - POSTGRES_USER=${POSTGRES_USER:-vb_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NBA_API_KEY=${NBA_API_KEY}
      - BETFAIR_APP_KEY=${BETFAIR_APP_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ODDS_API_KEY=${ODDS_API_KEY}
      - MAX_DAILY_LOSS_PCT=${MAX_DAILY_LOSS_PCT:-5.0}
      - KELLY_MULTIPLIER=${KELLY_MULTIPLIER:-0.25}
      - PREFECT_API_URL=http://prefect-server:4200/api
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./src:/app/src
      - ./configs:/app/configs
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vb-network

  # 4. Prefect Server (API & UI)
  prefect-server:
    image: prefecthq/prefect:2.13.0-python3.11
    container_name: vb-prefect-server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200" # Prefect UI
      - "4201:4200" # Prefect API mapped to 4201 on host to resolve port conflicts
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://${POSTGRES_USER:-vb_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-valuebetting}
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_SERVER_API_PORT=4200
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - prefect_data:/root/.prefect
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vb-network

  # 5. Prefect Agent
  prefect-agent:
    image: prefecthq/prefect:2.13.0-python3.11
    container_name: vb-prefect-agent
    command: prefect agent start -q default
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
    depends_on:
      - prefect-server
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vb-network

  # 6. MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: vb-mlflow
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vb-network

  # 7. Prometheus (Metrics Collector)
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: vb-prometheus
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./configs/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vb-network

  # 8. Node Exporter (System Resource Metrics)
  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: vb-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vb-network

  # 9. Grafana (Observability Dashboard)
  grafana:
    image: grafana/grafana:10.0.3
    container_name: vb-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vb-network

volumes:
  postgres_data:
  redis_data:
  prefect_data:
  mlflow_data:
  prometheus_data:
  grafana_data:

networks:
  vb-network:
    driver: bridge
