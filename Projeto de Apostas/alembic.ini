# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default version url
# is a time-based ID.
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max characters of encode to use when generating version filenames
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be loaded relative to the
# directory containing alembic.ini
# prepend_sys_path = false

# version location specification; this defaults to alembic/versions.
# When using multiple version directories, initial revisions must be
# specified with --version-path.
# version_locations = %(here)s/bar:%(here)s/bat

# version path separator; defaults to os.pathsep.
# Use a space to allow newline-separated list of directories
# version_path_separator = :

# set to 'true' to search source files recursively for revisions
# recursive_version_search = false

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
